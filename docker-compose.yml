version: "3.9"

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pollen-server
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    env_file:
      - ./server/.env
    environment:
      - NODE_ENV=production
    volumes:
      # Persist local uploads (Cloudinary is preferred in production)
      - uploads_data:/app/uploads

volumes:
  uploads_data:
